[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hvf-extraction-script"
version = "0.1.0"
description = "Coordinate-first parser for HFA static-perimetry DICOM objects."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
authors = [
    { name = "Murtaza Saifee", email = "saifeeapps@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = ["pydicom"]

[project.urls]
Homepage = "https://github.com/msaifee786/hvf_extraction_script"

[tool.setuptools.packages.find]
include = ["hvf_extraction_script*"]
